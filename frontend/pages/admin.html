<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel Administrativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    body {
      background: #FBF7F2;
      padding: 2rem 1rem;
      font-family: 'Jost', sans-serif;
      color: #7A4A52;
    }

    .container {
      width: min(980px, 100%);
      margin: 0 auto;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(122,74,82,0.1);
      border-radius: 20px;
      padding: 2rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.4rem, 5vw, 3.5rem);
      color: #7A4A52;
      margin-bottom: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .card {
      background: rgba(233,221,205,0.4);
      border-radius: 18px;
      padding: 1.2rem;
      border: 1px solid rgba(122,74,82,0.08);
    }

    .card strong {
      display: block;
      font-size: 0.74rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #B5858C;
      margin-bottom: 0.6rem;
    }

    .card span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      color: #7A4A52;
    }

    .admin-form,
    .guest-list {
      margin-top: 2rem;
      display: grid;
      gap: 1rem;
    }

    .admin-form[hidden] {
      display: none;
    }

    .admin-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .admin-fields label,
    .admin-form > label {
      display: grid;
      gap: 0.4rem;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .admin-fields input,
    .admin-fields textarea,
    .admin-form input[type="password"] {
      width: 100%;
      border: 1px solid rgba(122,74,82,0.18);
      border-radius: 8px;
      padding: 0.75rem;
      background: #fff;
      color: #7A4A52;
    }

    .admin-fields .wide {
      grid-column: 1 / -1;
    }

    .admin-check {
      display: flex !important;
      align-items: center;
      gap: 0.6rem !important;
    }

    .admin-form button {
      width: fit-content;
      border: 0;
      border-radius: 8px;
      padding: 0.8rem 1rem;
      color: #fff;
      background: #7A4A52;
      cursor: pointer;
    }

    .admin-message {
      min-height: 1.5rem;
    }

    .guest-row {
      border-top: 1px solid rgba(122,74,82,0.14);
      padding: 1rem 0;
    }

    .guest-row h2 {
      font: 600 1.25rem 'Jost', sans-serif;
      margin: 0 0 0.3rem;
      color: #7A4A52;
    }

    .guest-row p {
      font-size: 0.9rem;
    }

    .guest-actions,
    .person-status-form {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.75rem;
    }

    .guest-actions button,
    .person-status-form button,
    .guest-edit-form button {
      border: 0;
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      background: #7A4A52;
      color: #fff;
      cursor: pointer;
    }

    .guest-actions .danger {
      background: #8a3434;
    }

    .person-row {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) auto;
      align-items: center;
      gap: 0.75rem;
      border-top: 1px solid rgba(122,74,82,0.1);
      padding: 0.7rem 0;
    }

    .person-row select,
    .guest-edit-form input {
      border: 1px solid rgba(122,74,82,0.18);
      border-radius: 6px;
      padding: 0.5rem;
      color: #7A4A52;
      background: #fff;
    }

    .guest-edit-form {
      display: grid;
      gap: 0.7rem;
      margin-top: 0.8rem;
      padding: 1rem;
      background: rgba(233,221,205,0.28);
    }

    .guest-edit-form[hidden] {
      display: none;
    }

    .guest-edit-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.65rem;
    }

    .guest-edit-fields label {
      display: grid;
      gap: 0.3rem;
      font-size: 0.8rem;
    }

    .guest-edit-fields input[type="checkbox"] {
      width: auto;
    }

    .gift-admin-list {
      margin-top: 1rem;
      display: grid;
      gap: 0.75rem;
    }

    .gift-admin-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.75rem;
      border-top: 1px solid rgba(122,74,82,0.12);
      padding: 0.75rem 0;
    }

    .gift-admin-row p {
      margin: 0.25rem 0 0;
      font-size: 0.85rem;
    }

    .gift-admin-row button {
      border: 0;
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      background: #7A4A52;
      color: #fff;
      cursor: pointer;
    }

    .fixed-companion-form,
    .fixed-companion-edit {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 0;
      border-top: 1px solid rgba(122,74,82,0.1);
    }

    .fixed-companion-form input,
    .fixed-companion-edit input {
      flex: 1 1 180px;
      min-width: 0;
      border: 1px solid rgba(122,74,82,0.18);
      border-radius: 6px;
      padding: 0.55rem;
      color: #7A4A52;
      background: #fff;
    }

    .fixed-companion-form button,
    .fixed-companion-edit button {
      border: 0;
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      background: #7A4A52;
      color: #fff;
      cursor: pointer;
    }

    .fixed-companion-edit .danger {
      background: #8a3434;
    }

    @media (max-width: 640px) {
      .grid,
      .admin-fields,
      .guest-edit-fields,
      .person-row {
        grid-template-columns: 1fr;
      }

      .admin-fields .wide {
        grid-column: auto;
      }
    }
  </style>
</head>
<body data-page="admin" data-api-base="http://localhost:5000">
  <main class="container">
    <h1>Painel administrativo</h1>

    <form id="adminConnectForm" class="admin-form">
      <label for="adminKey">Chave administrativa
        <input id="adminKey" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Carregar convidados</button>
    </form>

    <p id="adminMessage" class="admin-message" role="status" aria-live="polite"></p>

    <section aria-label="Resumo de confirmações" class="grid">
      <div class="card"><strong>Vou</strong><span id="adminGoing">0</span></div>
      <div class="card"><strong>Não vou</strong><span id="adminNotGoing">0</span></div>
      <div class="card"><strong>A confirmar</strong><span id="adminPending">0</span></div>
    </section>

    <form id="guestCreateForm" class="admin-form" hidden>
      <h2>Novo convite</h2>
      <div class="admin-fields">
        <label>Nome do titular<input name="name" maxlength="120" required></label>
        <label>Grupo<input name="groupName" maxlength="120"></label>
        <label>WhatsApp<input name="whatsApp" maxlength="30" inputmode="tel"></label>
        <label>Limite de acompanhantes livres<input name="freeCompanionLimit" type="number" min="0" max="5" value="0"></label>
        <label class="wide">Acompanhantes fixos, um nome por linha<textarea name="companions" rows="3"></textarea></label>
        <label class="admin-check wide"><input name="allowFreeCompanions" type="checkbox"> Permitir acompanhantes livres</label>
      </div>
      <button type="submit">Cadastrar convite</button>
    </form>

    <p id="guestActionMessage" class="admin-message" role="status" aria-live="polite"></p>

    <section id="guestList" class="guest-list" aria-label="Convidados cadastrados"></section>

    <section id="giftAdminSection" class="admin-form" hidden aria-labelledby="giftAdminTitle">
      <h2 id="giftAdminTitle">Lista de presentes simbólicos</h2>
      <p>O cadastro cria opções fictícias com valor sugerido. Nenhuma cobrança é iniciada pelo site.</p>
      <form id="giftCreateForm" class="admin-fields">
        <label>Nome do item<input name="name" maxlength="120" required></label>
        <label>Valor sugerido (R$)<input name="amount" type="number" min="0.01" max="1000000" step="0.01" required></label>
        <label class="wide">Descrição<textarea name="description" maxlength="500" rows="2" required></textarea></label>
        <label class="wide">URL da imagem (opcional, HTTPS)<input name="imageUrl" type="url" maxlength="1000"></label>
        <button type="submit">Cadastrar presente</button>
      </form>
      <div id="giftAdminList" class="gift-admin-list" aria-label="Itens cadastrados"></div>
    </section>
  </main>
  <script src="../js/script.js"></script>
</body>
</html>
